name: TradingAgents
on:
  # حالت امن: اسکن خودکار خاموش است و اجرا فقط با دستور شروع می‌شود (دکمهٔ Run workflow یا فرمان تلگرام).
  # برای روشن‌کردن اسکن خودکار، علامت # را از دو خط زیر بردارید.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "حالت اجرا: Normal، VIP، Gold یا Eco (Eco ارزان‌ترین است؛ Gold برای تخفیف چهارروزهٔ Claude)"
        type: choice
        required: false
        default: "Normal"
        options:
          - Normal
          - VIP
          - Gold
          - Eco
      asset:
        description: "دارایی (پیش‌فرض Gold)"
        type: choice
        required: false
        default: "Gold"
        options:
          - ALL
          - ALLCRYPTO
          - ALLFOREX
          - Gold
          - NAS100
          - EURUSD
          - GBPUSD
          - BTC
          - ETH
          - DOGE
          - XRP
          - ADA
          - SOL
          - TRX
      search_min:
        description: "حداکثر دقیقه جستجو (۱۵ تا ۶۰)"
        type: choice
        required: false
        default: "60"
        options:
          - "15"
          - "20"
          - "30"
          - "45"
          - "60"
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'tradingagents-manual' || 'tradingagents' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # تیم ایجنت‌های مدلی همیشه روشن است
      TA_AGENTS: ${{ vars.TA_AGENTS_DEFAULT || '1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: data
          key: ta-data-${{ github.run_id }}
          restore-keys: ta-data-
      - name: Install dependencies
        run: |
          set -e
          mkdir -p TradingAgents
          pip install -q --disable-pip-version-check yfinance requests pandas numpy
          if [ "$TA_AGENTS" != "0" ]; then
            OK=0
            for REF in v0.3.1 v0.3.0 v0.2.5; do
              rm -rf TradingAgents
              if git clone -q --depth 1 --branch "$REF" https://github.com/TauricResearch/TradingAgents TradingAgents; then
                if [ -f TradingAgents/pyproject.toml ] || [ -f TradingAgents/setup.py ]; then
                  echo "using TradingAgents $REF"; OK=1; break
                fi
              fi
            done
            if [ "$OK" != "1" ]; then echo "no python TradingAgents tag found"; exit 1; fi
            pip install -q --disable-pip-version-check ./TradingAgents
            echo "PYTHONPATH=$GITHUB_WORKSPACE/TradingAgents" >> "$GITHUB_ENV"
          fi
      - name: Apply engine patches
        run: python tools/patch_engine.py engine.py run.py
        env:
          TA_LLM_PROVIDER: "1xai"
      - name: Apply desk patch (25 agents)
        # اگر وصله اعمال نشود اجرا همین‌جا با خطا می‌ایستد؛ با موتور قبلی ادامه نمی‌دهد.
        run: python tools/patch_desk.py engine.py
      - name: Apply team3 + ALL patch
        # اگر لنگری پیدا نشود، فایل دست‌نخورده می‌ماند و هشدار چاپ می‌شود؛ اجرا ادامه می‌دهد.
        continue-on-error: true
        run: python tools/patch_team3.py tools/desk25.py engine.py
      - name: Check engines (tiny probe calls)
        # هر موتور تیم با یک تماس بسیار کوچک امتحان می‌شود و نتیجه به تلگرام می‌رود؛ هزینه چند صد تومان.
        continue-on-error: true
        run: python tools/check_engines.py
        env:
          ONE_XAI_API_KEY: ${{ secrets.ONE_XAI_API_KEY }}
          ONE_XAI_BASE_URL: "https://1xai.ir"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TA_MODEL_MAP: ${{ vars.TA_MODEL_MAP }}
          TA_CHECK: ${{ vars.TA_CHECK || '1' }}
          TA_DATA: ${{ github.workspace }}/data
      - name: Run Infinity scan
        run: python run.py
        env:
          # همهٔ موتورها (Claude، Grok و بقیه) فقط با همین یک کلید 1xAi
          ONE_XAI_API_KEY: ${{ secrets.ONE_XAI_API_KEY }}
          CLAUDE_BASE_URL: "https://1xai.ir/anthropic"
          ONE_XAI_BASE_URL: "https://1xai.ir"
          GROK_API_KEY: ${{ secrets.ONE_XAI_API_KEY }}
          GROK_BASE_URL: "https://1xai.ir/v1"
          GROK_MODEL: "grok-4.7"
          TA_X_SCOUT: "1"
          TA_GROK_FALLBACK: "0"
          # تیم ۲۵ایجنت (tools/desk25.py)؛ برای خاموش‌کردن، متغیر TA_DESK را در Variables روی 0 بگذارید
          TA_DESK: ${{ vars.TA_DESK || '1' }}
          TA_MODEL_MAP: ${{ vars.TA_MODEL_MAP }}
          # Gold: جایگاه سریع روی Sonnet و جایگاه عمیق روی Opus (تخفیف چهارروزهٔ Claude)
          CLAUDE_HAIKU_MODEL: ${{ github.event.inputs.mode == 'Gold' && 'claude-sonnet-5-5' || vars.CLAUDE_HAIKU_MODEL || 'claude-haiku-5-5' }}
          CLAUDE_SONNET_MODEL: ${{ github.event.inputs.mode == 'Gold' && 'claude-opus-5-5' || vars.CLAUDE_SONNET_MODEL || 'claude-sonnet-5-5' }}
          CLAUDE_OPUS_MODEL: ${{ vars.CLAUDE_OPUS_MODEL || 'claude-opus-5-5' }}
          CLAUDE_FABLE_MODEL: ${{ vars.CLAUDE_FABLE_MODEL || 'claude-fable-5-2' }}
          CLAUDE_MYTHOS_MODEL: ${{ vars.CLAUDE_MYTHOS_MODEL || 'claude-mythos-5-2' }}
          CLAUDE_SONNET_EFFORT: ${{ vars.CLAUDE_SONNET_EFFORT || 'medium' }}
          # مدیرعامل: Normal/VIP/Gold سه تماس Fable بعد Opus؛ Eco سه تماس Sonnet 5.5 بعد Haiku
          TA_CEO_MODEL: ${{ github.event.inputs.mode == 'Eco' && 'claude-sonnet-5-5' || vars.TA_CEO_MODEL || 'claude-fable-5-2' }}
          TA_CEO_FALLBACK_MODEL: ${{ github.event.inputs.mode == 'Eco' && 'claude-haiku-5-5' || vars.TA_CEO_FALLBACK_MODEL || 'claude-opus-5-5' }}
          TA_CEO_MAX_CALLS: ${{ vars.TA_CEO_MAX_CALLS || '3' }}
          # بازبینی Mythos و Fable: در VIP و Gold روشن، در Normal و Eco خاموش
          TA_FRONTIER_TACTICAL: ${{ (github.event.inputs.mode == 'VIP' || github.event.inputs.mode == 'Gold') && '1' || '0' }}
          TA_CLAUDE_FALLBACK: "0"
          TA_CLAUDE_MAX_TOKENS: "4096"
          TA_MODE: ${{ github.event.inputs.mode || 'Normal' }}
          # سقف هزینهٔ هر اجرا (تومان، برآورد با قیمت لیست)؛ عدد اولیهٔ ایمنی، بعد از چند تست از Settings ← Variables تنظیم شود
          TA_COST_CAP_TOMAN: ${{ github.event.inputs.mode == 'Gold' && (vars.TA_CAP_GOLD || '350000') || github.event.inputs.mode == 'VIP' && (vars.TA_CAP_VIP || '250000') || github.event.inputs.mode == 'Eco' && (vars.TA_CAP_ECO || '80000') || (vars.TA_CAP_NORMAL || '150000') }}
          TA_LLM_PROVIDER: "1xai"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TA_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
          TA_SEARCH_MIN: ${{ github.event.inputs.search_min || '60' }}
          # حداقل پلهٔ اطمینان ثابت است (همان پیش‌فرض قبلی فرم)
          TA_MIN_LV: ${{ vars.TA_MIN_LV || '2' }}
          TA_REQUIRE_GO: "0"
          TA_LEAN: "0"
          TA_ANALYSTS: "market,social,news,fundamentals"
          TA_STRICT_HARD: "1"
          TA_FINAL_FALLBACK: "0"
          TA_STRICT: "1"
          TA_CEO_GRADES: "ABC"
          TA_LITE_AGENTS: "1"
          TA_AGENT_ROUNDS: "2"
          TA_LLM_BUDGET_SEC: "180"
          TA_AGENT_MIN: "18"
          TA_LLM_TOPK: "0"
          TA_MIN_PER_HOUR: "0"
          TA_TECH_AFTER: "0.5"
          TA_MAX_PER_HOUR: "999"
          TA_SPOT_ADJ: ${{ vars.TA_SPOT_ADJ || '0' }}
          TA_COOLDOWN_H: ${{ github.event_name == 'workflow_dispatch' && '0' || vars.TA_COOLDOWN_H || '1' }}
          TA_LIVE_SEC: "30"
          TA_DATA: ${{ github.workspace }}/data
      - name: Cost summary
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          RUN_MODE: ${{ github.event.inputs.mode || 'Normal' }}
          RUN_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          st = {"success": "تمام شد", "failure": "با خطا تمام شد", "cancelled": "لغو شد"}.get(os.environ.get("JOB_STATUS", ""), "نامشخص")
          head = f"هزینهٔ اجرا · {os.environ.get('RUN_MODE', '')} · {os.environ.get('RUN_ASSET', '')} · {st}"
          table = ""
          try:
              d = json.load(open("data/cost_summary.json", encoding="utf-8"))
              if d.get("run_id") != os.environ.get("GITHUB_RUN_ID"): raise ValueError("stale")
              bm = d["by_model"]; tin = sum(v["in"] for v in bm.values()); tout = sum(v["out"] for v in bm.values()); cap = int(d["cap_toman"])
              lines = [f"هزینهٔ اجرا · {d['mode']} · {d['asset']} · {st}",
                       f"تماس‌ها: {d['calls']} · توکن ورودی: {tin:,} · خروجی: {tout:,}",
                       f"برآورد: {d['spent_toman']:,} تومان از سقف {cap:,}" + (" (⛔ سقف پر شد)" if d.get("stopped_by_cap") else "")]
              top = sorted(bm.items(), key=lambda kv: -kv[1]["toman"])
              lines += [f"{m}: {v['calls']} تماس · {v['toman']:,} تومان" for m, v in top[:5]]
              lines.append("برآورد با قیمت لیست؛ مبلغ نهایی در صفحهٔ مصرف 1xAi.")
              table = "\n| مدل | تماس | توکن ورودی | توکن خروجی | تومان |\n|---|---:|---:|---:|---:|\n" + "".join(
                  f"| {m} | {v['calls']} | {v['in']:,} | {v['out']:,} | {v['toman']:,} |\n" for m, v in top)
          except FileNotFoundError:
              lines = [head, "هیچ تماس پولی ثبت نشد."]
          except ValueError:
              lines = [head, "هیچ تماس پولی در این اجرا ثبت نشد."]
          except Exception:
              lines = [head, "خلاصهٔ هزینه خوانده نشد؛ فایل cost_summary.json را در Artifact ببینید."]
          msg = "\n".join(lines)
          out.write("### هزینهٔ اجرا\n\n" + "\n".join("- " + l for l in lines) + "\n" + table)
          topic = os.environ.get("NTFY_TOPIC", "").strip().replace("https://ntfy.sh/", "").strip("/")
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic):
              out.write("\nاعلان ntfy ارسال نشد: NTFY_TOPIC خالی یا نامعتبر است.\n")
          else:
              try:
                  req = urllib.request.Request("https://ntfy.sh/" + topic, data=msg.encode("utf-8"),
                                               headers={"Title": "Infinity cost", "Priority": "3", "Tags": "moneybag", "User-Agent": "infinity-cost"})
                  urllib.request.urlopen(req, timeout=15).read()
                  out.write("\nاعلان هزینه به ntfy ارسال شد.\n")
              except Exception as ex:
                  out.write(f"\nارسال اعلان ntfy ناموفق بود ({type(ex).__name__}).\n")
          out.close()
          PY
      - name: Telegram report
        if: always()
        # وضعیت اتصال موتورها و هزینه؛ متن پرامپت و پاسخ ایجنت‌ها فرستاده نمی‌شود. بدون Secrets فقط پیش‌نمایش چاپ می‌شود.
        run: python3 tools/tg_notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TA_DATA: ${{ github.workspace }}/data
          JOB_STATUS: ${{ job.status }}
          RUN_MODE: ${{ github.event.inputs.mode || 'Normal' }}
          RUN_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infinity-report-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: data
          key: ta-data-${{ github.run_id }}
