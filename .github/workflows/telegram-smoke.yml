name: Telegram connection test

on:
  workflow_dispatch:

permissions: {}

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CODE: ${{ secrets.TELEGRAM_TEST_CODE }}
    steps:
      - name: Verify bot and send a private test message if configured
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          code = os.environ['TELEGRAM_TEST_CODE'].strip()
          if not token:
              sys.exit('TELEGRAM_BOT_TOKEN is not configured.')
          if not re.fullmatch(r'[0-9]+:[A-Za-z0-9_-]+', token):
              sys.exit('Invalid TELEGRAM_BOT_TOKEN format. Store only the token copied from BotFather.')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def fail(method, status):
              hints = {
                  401: 'Telegram rejected the token. Check the current BotFather token in GitHub Secrets.',
                  404: 'Telegram did not recognize the API path. Check that the BotFather token was copied in full.',
                  403: 'Telegram forbids this request. For sendMessage, make sure the chat has started and not blocked the bot.',
                  409: 'A webhook or another Telegram consumer may be active.',
                  429: 'Telegram rate limited the request; try again shortly.',
              }
              sys.exit(f'Telegram {method}: HTTP/API {status}. {hints.get(status, "No credentials logged.")}')

          def call(method, **fields):
              url = f'https://api.telegram.org/bot{token}/{method}'
              data = urllib.parse.urlencode(fields).encode() if fields else None
              try:
                  with opener.open(url, data=data, timeout=15) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  fail(method, exc.code)
              except (OSError, ValueError) as exc:
                  sys.exit(f'Telegram {method}: connection or response error ({type(exc).__name__}). No credentials logged.')
              if isinstance(result, dict) and result.get('ok'):
                  return result['result']
              status = result.get('error_code') if isinstance(result, dict) else None
              if type(status) is int and 100 <= status <= 599:
                  fail(method, status)
              sys.exit(f'Telegram {method}: unexpected API response. No credentials logged.')

          if call('getMe').get('username', '').lower() != 'infinity070moneybot':
              sys.exit('The token belongs to a different bot.')
          print('Telegram verified @Infinity070MoneyBot.', flush=True)

          if not chat_id and code:
              if not re.fullmatch(r'[A-Za-z0-9]{12,64}', code):
                  sys.exit('Use a random test code of 12–64 English letters or digits.')
              if call('getWebhookInfo').get('url'):
                  sys.exit('An existing webhook is configured; use TELEGRAM_CHAT_ID instead. No webhook was changed.')
              cutoff = int(time.time()) - 900
              matches = set()
              for update in call('getUpdates', limit=100, timeout=0):
                  message = update.get('message', {})
                  chat = message.get('chat', {})
                  if chat.get('type') == 'private' and message.get('date', 0) >= cutoff and message.get('text') == '/test ' + code:
                      matches.add(str(chat.get('id', '')))
              if len(matches) != 1:
                  sys.exit('No unique recent private test command found. Send /test followed by your test code and start a new run.')
              chat_id = matches.pop()

          if not chat_id:
              print('Bot verified; no destination configured, so no message was sent.')
          elif not chat_id.isascii() or not chat_id.isdecimal() or int(chat_id) <= 0:
              sys.exit('The destination must be a positive private-chat ID.')
          else:
              call('sendMessage', chat_id=chat_id, text='اتصال برقرار شد ✅')
              print('Private test message sent.')
          PY
