name: TradingAgents
on:
  schedule:
    - cron: "*/5 * * * *" # هر ۵ دقیقه ماشه می‌خورد؛ تا اجرای قبلی تمام نشده باشد در صف می‌ماند (concurrency)، پس نوبت بعدی ≤ ۵ دقیقه بعد از پایان نوبت قبلی شروع می‌شود
  workflow_dispatch:
    inputs:
      asset:
        description: "دارایی (پیش‌فرض Gold)"
        type: choice
        required: false
        default: "Gold"
        options:
          - Gold
          - Silver
          - BTC
          - ETH
          - ALL
      search_min:
        description: "حداکثر دقیقه جستجو"
        required: false
        default: "60"
      min_lv:
        description: "حداقل پله اطمینان (۳ یا ۴)"
        required: false
        default: "3"
      agents:
        description: "تیم ایجنت‌های مدلی: 0 = خاموش | 1 = روشن (پیش‌فرض؛ فقط مشاور است و سقف زمان دارد)"
        required: false
        default: "1"
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'tradingagents-manual' || 'tradingagents' }}      # اجرای دستی صف جدا دارد تا پشت ماشه‌های ۵دقیقه‌ای نماند یا جایش را نگیرند
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TA_AGENTS: ${{ github.event.inputs.agents || vars.TA_AGENTS_DEFAULT || '1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: data
          key: ta-data-${{ github.run_id }}
          restore-keys: ta-data-
      - name: Install dependencies
        run: |
          set -e
          mkdir -p TradingAgents
          pip install -q --disable-pip-version-check yfinance requests pandas numpy
          if [ "$TA_AGENTS" != "0" ]; then
            # فقط برای حالت ایجنت: نسخهٔ پایتونیِ تگ‌شده (شاخهٔ main ریپوی اصلی دیگر پایتون نیست)
            OK=0
            for REF in v0.3.1 v0.3.0 v0.2.5; do
              rm -rf TradingAgents
              if git clone -q --depth 1 --branch "$REF" https://github.com/TauricResearch/TradingAgents TradingAgents; then
                if [ -f TradingAgents/pyproject.toml ] || [ -f TradingAgents/setup.py ]; then
                  echo "using TradingAgents $REF"; OK=1; break
                fi
              fi
            done
            if [ "$OK" != "1" ]; then echo "no python TradingAgents tag found"; exit 1; fi
            pip install -q --disable-pip-version-check ./TradingAgents
            echo "PYTHONPATH=$GITHUB_WORKSPACE/TradingAgents" >> "$GITHUB_ENV"
          fi
      - name: Run Infinity scan
        run: python run.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TA_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
          TA_SEARCH_MIN: ${{ github.event.inputs.search_min || '60' }}
          TA_MIN_LV: ${{ github.event.inputs.min_lv || '3' }}
          TA_REQUIRE_GO: "0"
          TA_FINAL_FALLBACK: "1"   # پایان مهلت: بهترین گزینه با پرچم ریسک فرستاده می‌شود (همیشه سیگنال)
          TA_AGENT_MIN: "7"        # سقف زمان تیم ایجنت‌ها؛ بیشتر شد بدون ایجنت ادامه می‌دهد
          TA_LLM_TOPK: "0"         # ایجنت‌ها وسط جست‌وجو دروازه‌بان نیستند
          TA_MIN_PER_HOUR: "0"
          TA_TECH_AFTER: "0.5"     # بعد از نیمهٔ مهلت، ستاپ تکنیکالِ خوب هم پذیرفته می‌شود
          # سقف ساعتی برداشته شد: هر نوبت تا ۶۰ دقیقه می‌گردد، سیگنال پیدا شد فرستاده می‌شود و نوبت بعد ≤ ۵ دقیقه بعد شروع می‌شود.
          # کولداون فقط جلوی ارسالِ دوبارهٔ «همان دارایی و همان جهت» را می‌گیرد؛ دستی = بدون کولداون. (برای تغییر: Variable با نام TA_COOLDOWN_H)
          TA_MAX_PER_HOUR: "999"
          TA_SPOT_ADJ: ${{ vars.TA_SPOT_ADJ || '0' }}      # اختلاف بروکر شما با منبع عمومی؛ در Settings→Variables بگذارید
          TA_COOLDOWN_H: ${{ github.event_name == 'workflow_dispatch' && '0' || vars.TA_COOLDOWN_H || '1' }}
          TA_LIVE_SEC: "30"        # قبل از ارسال، ۳۰ ثانیه قیمت زنده آپدیت می‌شود و سیگنال با آخرین قیمت فرستاده می‌شود
          TA_DATA: ${{ github.workspace }}/data
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infinity-report-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: data
          key: ta-data-${{ github.run_id }}
