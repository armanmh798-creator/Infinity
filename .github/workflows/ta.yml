name: TradingAgents
on:
  # زمان‌بند خودکار خاموش است تا بدون اجازه از کیف پول خرج نشود.
  # برای روشن‌کردن، علامت # را از دو خط زیر بردارید.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "حالت اجرا: VIP یا Normal"
        type: choice
        required: false
        default: "Normal"
        options:
          - Normal
          - VIP
      asset:
        description: "دارایی (پیش‌فرض Gold)"
        type: choice
        required: false
        default: "Gold"
        options:
          - Gold
          - BTC
          - ETH
          - ALL
          - Silver
      search_min:
        description: "حداکثر دقیقه جستجو (۱۵ تا ۶۰)"
        type: choice
        required: false
        default: "60"
        options:
          - "15"
          - "20"
          - "30"
          - "45"
          - "60"
      min_lv:
        description: "حداقل پله اطمینان (۳ یا ۴)"
        required: false
        default: "2"
      agents:
        description: "تیم ایجنت‌های مدلی: 0 = خاموش | 1 = روشن (پیش‌فرض؛ فقط مشاور است و سقف زمان دارد)"
        required: false
        default: "1"
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'tradingagents-manual' || 'tradingagents' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TA_AGENTS: ${{ github.event.inputs.agents || vars.TA_AGENTS_DEFAULT || '1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: data
          key: ta-data-${{ github.run_id }}
          restore-keys: ta-data-
      - name: Install dependencies
        run: |
          set -e
          mkdir -p TradingAgents
          pip install -q --disable-pip-version-check yfinance requests pandas numpy
          if [ "$TA_AGENTS" != "0" ]; then
            OK=0
            for REF in v0.3.1 v0.3.0 v0.2.5; do
              rm -rf TradingAgents
              if git clone -q --depth 1 --branch "$REF" https://github.com/TauricResearch/TradingAgents TradingAgents; then
                if [ -f TradingAgents/pyproject.toml ] || [ -f TradingAgents/setup.py ]; then
                  echo "using TradingAgents $REF"; OK=1; break
                fi
              fi
            done
            if [ "$OK" != "1" ]; then echo "no python TradingAgents tag found"; exit 1; fi
            pip install -q --disable-pip-version-check ./TradingAgents
            echo "PYTHONPATH=$GITHUB_WORKSPACE/TradingAgents" >> "$GITHUB_ENV"
          fi
      - name: Run Infinity scan
        run: python run.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          GOOGLE_API_KEY_4: ${{ secrets.GOOGLE_API_KEY_4 }}
          GOOGLE_API_KEY_5: ${{ secrets.GOOGLE_API_KEY_5 }}
          GOOGLE_API_KEY_6: ${{ secrets.GOOGLE_API_KEY_6 }}
          GOOGLE_API_KEY_7: ${{ secrets.GOOGLE_API_KEY_7 }}
          GOOGLE_API_KEY_8: ${{ secrets.GOOGLE_API_KEY_8 }}
          GOOGLE_API_KEY_9: ${{ secrets.GOOGLE_API_KEY_9 }}
          GOOGLE_API_KEY_10: ${{ secrets.GOOGLE_API_KEY_10 }}
          # همهٔ موتورها با همین یک کلید 1xAi
          ONE_XAI_API_KEY: ${{ secrets.ONE_XAI_API_KEY }}
          CLAUDE_BASE_URL: "https://1xai.ir/anthropic"
          ONE_XAI_BASE_URL: "https://1xai.ir"
          GROK_API_KEY: ${{ secrets.ONE_XAI_API_KEY }}
          GROK_BASE_URL: "https://1xai.ir/v1"
          GROK_MODEL: "grok-4.7"
          CLAUDE_HAIKU_MODEL: ${{ vars.CLAUDE_HAIKU_MODEL || 'claude-haiku-5-5' }}
          CLAUDE_SONNET_MODEL: ${{ vars.CLAUDE_SONNET_MODEL || 'claude-sonnet-5-5' }}
          CLAUDE_OPUS_MODEL: ${{ vars.CLAUDE_OPUS_MODEL || 'claude-opus-5-5' }}
          CLAUDE_FABLE_MODEL: ${{ vars.CLAUDE_FABLE_MODEL || 'claude-fable-5-2' }}
          CLAUDE_MYTHOS_MODEL: ${{ vars.CLAUDE_MYTHOS_MODEL || 'claude-mythos-5-2' }}
          CLAUDE_SONNET_EFFORT: ${{ vars.CLAUDE_SONNET_EFFORT || 'medium' }}
          # مدیرعامل در هر دو حالت یکسان: مدل اصلی تا سقف تماس، بعد مدل پشتیبان
          TA_CEO_MODEL: ${{ vars.TA_CEO_MODEL || 'claude-fable-5-2' }}
          TA_CEO_FALLBACK_MODEL: ${{ vars.TA_CEO_FALLBACK_MODEL || 'claude-opus-5-5' }}
          TA_CEO_MAX_CALLS: ${{ vars.TA_CEO_MAX_CALLS || '3' }}
          # VIP = بازبینی Mythos و Fable روشن | Normal = خاموش
          TA_FRONTIER_TACTICAL: ${{ (github.event.inputs.mode || vars.TA_MODE_DEFAULT || 'Normal') == 'VIP' && '1' || '0' }}
          TA_CLAUDE_FALLBACK: "0"
          TA_CLAUDE_MAX_TOKENS: "4096"
          TA_LLM_PROVIDER: "1xai"
          TA_KEY_START: ${{ github.run_number }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TA_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
          TA_SEARCH_MIN: ${{ github.event.inputs.search_min || '60' }}
          TA_MIN_LV: ${{ github.event.inputs.min_lv || '3' }}
          TA_REQUIRE_GO: "0"
          TA_LEAN: "0"
          TA_ANALYSTS: "market,social,news,fundamentals"
          TA_STRICT_HARD: "1"
          TA_FINAL_FALLBACK: "0"
          TA_STRICT: "1"
          TA_CEO_GRADES: "ABC"
          TA_LITE_AGENTS: "1"
          TA_AGENT_ROUNDS: "2"
          TA_LLM_BUDGET_SEC: "180"
          TA_AGENT_MIN: "18"
          TA_LLM_TOPK: "0"
          TA_MIN_PER_HOUR: "0"
          TA_TECH_AFTER: "0.5"
          TA_MAX_PER_HOUR: "999"
          TA_SPOT_ADJ: ${{ vars.TA_SPOT_ADJ || '0' }}
          TA_COOLDOWN_H: ${{ github.event_name == 'workflow_dispatch' && '0' || vars.TA_COOLDOWN_H || '1' }}
          TA_LIVE_SEC: "30"
          TA_DATA: ${{ github.workspace }}/data
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infinity-report-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: data
          key: ta-data-${{ github.run_id }}
