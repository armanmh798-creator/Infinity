name: TradingAgents
on:
  schedule:
    - cron: "7 * * * *" # هر ساعت، دقیقه ۷ (UTC)
  workflow_dispatch:
    inputs:
      asset:
        description: "Gold (پیش‌فرض) یا ALL یا یک/چند دارایی (مثلاً BTC یا BTC,ETH)"
        required: false
        default: "Gold"
      search_min:
        description: "حداکثر دقیقه جستجو"
        required: false
        default: "55"
      min_lv:
        description: "حداقل پله اطمینان (۳ یا ۴)"
        required: false
        default: "3"
concurrency:
  group: tradingagents
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: ta-data-${{ github.run_id }}
          restore-keys: ta-data-
      - name: Clone and install TradingAgents
        run: |
          set -e
          # شاخهٔ main ریپوی اصلی دیگر پایتون نیست (پروژهٔ Node/TypeScript شده)؛ نسخهٔ پایتونیِ تگ‌شده را می‌گیریم.
          OK=0
          for REF in v0.3.1 v0.3.0 v0.2.5; do
            rm -rf TradingAgents
            if git clone -q --depth 1 --branch "$REF" https://github.com/TauricResearch/TradingAgents TradingAgents; then
              if [ -f TradingAgents/pyproject.toml ] || [ -f TradingAgents/setup.py ]; then
                echo "using TradingAgents $REF"; OK=1; break
              fi
            fi
          done
          if [ "$OK" != "1" ]; then echo "no python TradingAgents tag found"; ls TradingAgents || true; exit 1; fi
          pip install -q ./TradingAgents
          pip install -q yfinance requests pandas numpy
          echo "PYTHONPATH=$GITHUB_WORKSPACE/TradingAgents" >> "$GITHUB_ENV"
          PYTHONPATH="$GITHUB_WORKSPACE/TradingAgents" python -c "import tradingagents; print('tradingagents OK')"
      - name: Run Infinity scan
        run: python run.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TA_ASSET: ${{ github.event.inputs.asset || vars.TA_ASSET_DEFAULT || 'Gold' }}
          TA_AGENTS: "1"
          TA_SEARCH_MIN: ${{ github.event.inputs.search_min || '55' }}
          TA_MIN_LV: ${{ github.event.inputs.min_lv || '3' }}
          TA_REQUIRE_GO: "0"
          TA_FINAL_FALLBACK: "0"
          TA_MIN_PER_HOUR: "0"
          TA_TECH_AFTER: "2"
          TA_COOLDOWN_H: "1"
          TA_DATA: ${{ github.workspace }}/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-report-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: ta-data-${{ github.run_id }}
